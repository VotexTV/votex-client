<!doctype html><html lang="de"><meta charset="utf-8"><title>Interne Votex-Fensterprüfung</title><style>body{margin:16px;background:#121724;color:#dae5f8;font:13px system-ui}header{display:flex;gap:12px;align-items:center;margin-bottom:16px}button{padding:8px 16px}iframe{border:1px solid #526583;display:block;background:#080b14}</style><header>Interne Fensterprüfung <button data-size="800,560">800 × 560</button><button data-size="1000,650">1000 × 650</button><output></output></header><iframe title="Votex im Testfenster" src="/" width="800" height="560"></iframe><script>const frame=document.querySelector('iframe');document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const[w,h]=b.dataset.size.split(',');frame.width=w;frame.height=h;document.querySelector('output').textContent=w+' × '+h});</script></html>
