# Builds and tests Votex on a GitHub-hosted Windows runner.
# Reason: on the developer PC, Smart App Control (enforced) blocks every freshly compiled
# Rust/C++ build script (os error 4551). The runner is a separate, legitimate build environment.
# The installer produced here is UNSIGNED. It is a test artifact, not a release.
name: windows-build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Frontend tests (Vitest)
        run: pnpm test
      - name: Frontend build (tsc + vite)
        run: pnpm build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Java Core tests
        working-directory: minecraft/votex-core
        run: ./gradlew.bat --no-daemon test compileGametestJava
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust check
        run: cargo check --locked --manifest-path apps/launcher/src-tauri/Cargo.toml
      - name: Rust tests (non-ignored only; ignored tests need network or real artifacts)
        run: cargo test --locked --manifest-path apps/launcher/src-tauri/Cargo.toml

  installer:
    # Independent of the test job so a failing test stays visible without hiding the build result.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build Java Core JAR
        working-directory: minecraft/votex-core
        run: ./gradlew.bat --no-daemon build
      - name: Stage Core JAR into Tauri resources
        shell: pwsh
        run: ./scripts/stage-core.ps1
      - uses: dtolnay/rust-toolchain@stable
      - name: Build NSIS installer (unsigned)
        run: pnpm desktop:build
      - name: Hashes
        shell: pwsh
        run: |
          Get-ChildItem apps/launcher/src-tauri/target/release/bundle/nsis/*.exe, minecraft/votex-core/build/libs/*.jar |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Tee-Object -FilePath SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: votex-unsigned-test-build
          path: |
            apps/launcher/src-tauri/target/release/bundle/nsis/*.exe
            minecraft/votex-core/build/libs/votex-client-core-*.jar
            SHA256SUMS.txt
          retention-days: 7
