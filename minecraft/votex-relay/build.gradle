plugins { id 'net.fabricmc.fabric-loom' version '1.18.4' }
group = 'dev.votex'
version = '0.4.1'
base { archivesName = 'votex-social-relay' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:26.2'
 implementation 'net.fabricmc:fabric-loader:0.19.5'
 implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.2'
}
// The exact same validation and wire protocol are compiled on the server and client.
sourceSets.main.java.srcDir('../votex-core/src/main/java')
sourceSets.main.java.include('dev/votex/social/**', 'dev/votex/relay/**')
processResources {
 from('../votex-core/src/main/resources') { include 'assets/votex_client/catalog/index.json' }
 inputs.property 'version', project.version
 filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { withSourcesJar() }
